[package]
name = "dprint-plugin-nix"
version = "0.1.2"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-nix"
keywords = ["formatting", "formatter", "nix", "nixfmt"]
license = "MPL-2.0"
publish = false
repository = "https://github.com/dprint/dprint-plugin-nix"
description = "Nix formatter for dprint via nixfmt-rs."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
dprint-core = { version = "0.73.0", default-features = false }
# nixfmt_rs enables the "cli" feature by default, which pulls in native
# dependencies like mimalloc. Disable default features for the wasm target.
nixfmt_rs = { version = "0.5.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2"

[dev-dependencies]
dprint-development = "0.12.1"
serde_json = "1.0.154"
